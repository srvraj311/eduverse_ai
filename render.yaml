services:
  - type: web
    name: eduverse-ai
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false # paste your Atlas connection string in the Render dashboard
      - key: MONGO_DB
        value: eduverse
      - key: API_KEY
        sync: false # Groq API key
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://eduverse-ai.onrender.com
